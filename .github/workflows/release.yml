name: Release standalone binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      test_version:
        description: "Test version label (e.g. v0.0.0rc1)"
        required: true
        default: "v0.0.0rc1"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      draft: ${{ steps.v.outputs.draft }}
      pip_version: ${{ steps.v.outputs.pip_version }}
    steps:
      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.test_version }}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "pip_version=0.0.0" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
            echo "pip_version=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    needs: resolve
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install package and PyInstaller
        run: pip install . pyinstaller
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.resolve.outputs.pip_version }}

      - name: Build standalone binary
        run: |
          pyinstaller --onefile --name emby-cli \
            --hidden-import emby_cli \
            --collect-submodules emby_cli \
            src/emby_cli/__main__.py
          mv dist/emby-cli dist/emby-cli-${{ needs.resolve.outputs.tag }}-macos-arm64

      - name: Generate checksums
        run: |
          cd dist
          for f in emby-cli-*; do shasum -a 256 "$f" > "$f.sha256"; done

      - uses: actions/upload-artifact@v6
        with:
          name: binaries-macos-arm64
          path: dist/emby-cli-*
          if-no-files-found: error
          retention-days: 1

  build-linux:
    needs: resolve
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build inside Debian 11 container (glibc 2.31)
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e SETUPTOOLS_SCM_PRETEND_VERSION="${{ needs.resolve.outputs.pip_version }}" \
            -e TAG="${{ needs.resolve.outputs.tag }}" \
            python:${{ env.PYTHON_VERSION }}-slim-bullseye bash -c '
              set -e
              apt-get update -qq && apt-get install -y -qq binutils > /dev/null
              pip install --quiet . pyinstaller

              pyinstaller --onefile --name emby-cli \
                --hidden-import emby_cli \
                --collect-submodules emby_cli \
                src/emby_cli/__main__.py
              mv dist/emby-cli "dist/emby-cli-${TAG}-linux-x64"

              cd dist
              for f in emby-cli-*; do sha256sum "$f" > "$f.sha256"; done
            '

      - uses: actions/upload-artifact@v6
        with:
          name: binaries-linux-x64
          path: dist/emby-cli-*
          if-no-files-found: error
          retention-days: 1

  build-windows:
    needs: resolve
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install package and PyInstaller
        run: pip install . pyinstaller
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.resolve.outputs.pip_version }}

      - name: Build standalone binary
        run: |
          pyinstaller --onefile --name emby-cli `
            --hidden-import emby_cli `
            --collect-submodules emby_cli `
            src/emby_cli/__main__.py
          Move-Item dist/emby-cli.exe "dist/emby-cli-${{ needs.resolve.outputs.tag }}-windows-x64.exe"
        shell: pwsh

      - name: Generate checksums
        run: |
          Get-ChildItem dist/emby-cli-* -Exclude *.sha256 | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ASCII "$($_.FullName).sha256"
          }
        shell: pwsh

      - uses: actions/upload-artifact@v6
        with:
          name: binaries-windows-x64
          path: dist/emby-cli-*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [resolve, build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: binaries-*
          merge-multiple: true
          path: assets

      - name: List assets
        run: ls -lh assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          draft: ${{ needs.resolve.outputs.draft }}
          generate_release_notes: true
          files: assets/*
