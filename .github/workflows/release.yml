name: Release standalone binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      test_version:
        description: "Test version label (e.g. v0.0.0rc1)"
        required: true
        default: "v0.0.0rc1"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      draft: ${{ steps.v.outputs.draft }}
      pip_version: ${{ steps.v.outputs.pip_version }}
    steps:
      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.test_version }}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"
            echo "pip_version=0.0.0" >> "$GITHUB_OUTPUT"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
            echo "pip_version=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    needs: resolve
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install package and PyInstaller
        run: pip install . pyinstaller
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.resolve.outputs.pip_version }}

      - name: Build light variant
        run: |
          pyinstaller --onefile --name emby-cli \
            --hidden-import emby_cli \
            --hidden-import static_ffmpeg \
            --hidden-import static_ffmpeg.run \
            --collect-submodules emby_cli \
            src/emby_cli/__main__.py
          mv dist/emby-cli dist/emby-cli-${{ needs.resolve.outputs.tag }}-macos-arm64

      - name: Clean PyInstaller state
        run: rm -rf build/ dist/emby-cli emby-cli.spec

      - name: Pre-fetch ffmpeg
        run: python -c "from static_ffmpeg.run import get_or_fetch_platform_executables_else_raise; get_or_fetch_platform_executables_else_raise()"

      - name: Locate ffmpeg binaries
        id: ffmpeg
        run: |
          echo "dir=$(python -c 'from static_ffmpeg.run import get_platform_dir; print(get_platform_dir())')" >> "$GITHUB_OUTPUT"
          echo "key=$(python -c 'from static_ffmpeg.run import get_platform_key; print(get_platform_key())')" >> "$GITHUB_OUTPUT"

      - name: Build full variant (bundled ffmpeg)
        run: |
          pyinstaller --onefile --name emby-cli \
            --hidden-import emby_cli \
            --hidden-import static_ffmpeg \
            --hidden-import static_ffmpeg.run \
            --collect-submodules emby_cli \
            --add-data "${{ steps.ffmpeg.outputs.dir }}:static_ffmpeg/bin/${{ steps.ffmpeg.outputs.key }}" \
            src/emby_cli/__main__.py
          mv dist/emby-cli dist/emby-cli-${{ needs.resolve.outputs.tag }}-macos-arm64-full

      - name: Generate checksums
        run: |
          cd dist
          for f in emby-cli-*; do shasum -a 256 "$f" > "$f.sha256"; done

      - uses: actions/upload-artifact@v6
        with:
          name: binaries-macos-arm64
          path: dist/emby-cli-*
          if-no-files-found: error
          retention-days: 1

  build-linux:
    needs: resolve
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build inside Debian 11 container (glibc 2.31)
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e SETUPTOOLS_SCM_PRETEND_VERSION="${{ needs.resolve.outputs.pip_version }}" \
            -e TAG="${{ needs.resolve.outputs.tag }}" \
            python:${{ env.PYTHON_VERSION }}-slim-bullseye bash -c '
              set -e
              pip install --quiet . pyinstaller

              echo "::group::Build light variant"
              pyinstaller --onefile --name emby-cli \
                --hidden-import emby_cli \
                --hidden-import static_ffmpeg \
                --hidden-import static_ffmpeg.run \
                --collect-submodules emby_cli \
                src/emby_cli/__main__.py
              mv dist/emby-cli "dist/emby-cli-${TAG}-linux-x64"
              echo "::endgroup::"

              rm -rf build/ dist/emby-cli emby-cli.spec

              echo "::group::Pre-fetch ffmpeg"
              python -c "from static_ffmpeg.run import get_or_fetch_platform_executables_else_raise; get_or_fetch_platform_executables_else_raise()"
              FFMPEG_DIR=$(python -c "from static_ffmpeg.run import get_platform_dir; print(get_platform_dir())")
              FFMPEG_KEY=$(python -c "from static_ffmpeg.run import get_platform_key; print(get_platform_key())")
              echo "::endgroup::"

              echo "::group::Build full variant"
              pyinstaller --onefile --name emby-cli \
                --hidden-import emby_cli \
                --hidden-import static_ffmpeg \
                --hidden-import static_ffmpeg.run \
                --collect-submodules emby_cli \
                --add-data "${FFMPEG_DIR}:static_ffmpeg/bin/${FFMPEG_KEY}" \
                src/emby_cli/__main__.py
              mv dist/emby-cli "dist/emby-cli-${TAG}-linux-x64-full"
              echo "::endgroup::"

              cd dist
              for f in emby-cli-*; do sha256sum "$f" > "$f.sha256"; done
            '

      - uses: actions/upload-artifact@v6
        with:
          name: binaries-linux-x64
          path: dist/emby-cli-*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [resolve, build-macos, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: binaries-*
          merge-multiple: true
          path: assets

      - name: List assets
        run: ls -lh assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          draft: ${{ needs.resolve.outputs.draft }}
          generate_release_notes: true
          files: assets/*
